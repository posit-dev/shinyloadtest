name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish (for example v2.0.0-alpha.7)
        required: true
      promote_latest:
        description: Point the `latest` dist-tag at this version after publishing
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    name: Publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Publishing authenticates via OIDC trusted publishing (no NPM_TOKEN
      # secret). That requires npm >= 11.5.1 and cannot be done with a
      # non-reproducible `npm@latest`, so pin the version. Older npm still
      # signs a provenance statement but sends the PUT unauthenticated, which
      # npm reports as a misleading `404 Not Found`. Node 22 bundles npm 10.
      - name: Pin npm for OIDC trusted publishing
        run: npm install -g npm@11.21.1

      - run: npm ci
      - run: npm run build

      # Derive from the version string rather than the release event: the
      # event payload is absent when a release is re-published by hand, and
      # an empty value would fall through to `latest` for a prerelease.
      - name: Determine npm tag
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Publishing is not idempotent: a release whose first package published
      # but whose stub failed cannot be re-run, because npm rejects republishing
      # an existing version. Skip versions that are already on the registry so
      # the job can be safely retried.
      - name: Publish shinyloadtest
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "shinyloadtest@$version" version >/dev/null 2>&1; then
            echo "shinyloadtest@$version is already published; nothing to do"
          else
            npm publish --access public --provenance --tag ${{ steps.tag.outputs.npm_tag }}
          fi

      - name: Publish shinycannon stub
        working-directory: packages/shinycannon
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "shinycannon@$version" version >/dev/null 2>&1; then
            echo "shinycannon@$version is already published; nothing to do"
          else
            npm publish --access public --provenance --tag ${{ steps.tag.outputs.npm_tag }}
          fi

      # `latest` is normally only set by the release's own dist-tag. Expose it
      # as an explicit dispatch input so an existing version can be promoted
      # without a local npm login, using the trusted publisher's dist-tag
      # permission (requires npm >= 11.21.0, which the step above pins).
      - name: Promote latest dist-tag
        if: inputs.promote_latest
        run: |
          version=$(node -p "require('./package.json').version")
          stub_version=$(node -p "require('./packages/shinycannon/package.json').version")
          npm dist-tag add "shinyloadtest@$version" latest
          npm dist-tag add "shinycannon@$stub_version" latest
